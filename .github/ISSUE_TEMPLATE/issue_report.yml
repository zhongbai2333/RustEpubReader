name: "Issue 报告"
description: 反馈 Bug / 使用问题 / 功能建议
title: "[Issue] "
labels: ["NEW"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！为了更快定位问题，请尽量提供：
        - **程序版本**（关于页面可查看）
        - **操作系统与平台**（Windows / macOS / Linux / Android / iOS / iPadOS）
        - **复现步骤**
        - **日志或截图**（如涉及崩溃、渲染异常、Android 或 iOS 安装/启动问题）

        > 如涉及私有电子书内容，请优先提供脱敏片段或可公开复现文件，避免上传完整私有书籍。

  - type: dropdown
    id: issue_type
    attributes:
      label: 问题类型
      description: 请选择最接近的类型
      options:
        - Bug（功能异常/崩溃）
        - Question（使用疑问）
        - Enhancement（功能建议）
        - Documentation（文档问题）
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 平台
      description: 问题出现在哪些平台？（可多选）
      multiple: true
      options:
        - Windows (x64)
        - Windows (ARM64)
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (x64)
        - Linux (ARM64)
        - Android
        - iOS (iPhone)
        - iPadOS (iPad)
    validations:
      required: true

  - type: dropdown
    id: affected_area
    attributes:
      label: 影响范围
      description: 问题主要发生在哪一部分？
      options:
        - 桌面端阅读 / 书库管理
        - Android 阅读 / 安装 / 启动
        - iOS / iPadOS 阅读 / 导入 / 启动
        - EPUB 解析 / 渲染
        - TXT 转 EPUB
        - 搜索 / 导出 / 分享
        - 中文纠错（CSC）/ 模型加载
        - 自更新 / Release 产物
        - 构建 / CI / 发布
        - 文档 / 示例
        - 其他
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 发生了什么？你期望的结果是什么？
      placeholder: |
        例如：打开某本 EPUB 时闪退，期望能正常显示内容。
    validations:
      required: true

  - type: textarea
    id: reproduce_steps
    attributes:
      label: 复现步骤（可选但建议）
      description: 尽量按步骤描述，方便快速复现
      placeholder: |
        1. 打开程序
        2. 导入 xxx.epub
        3. 翻到第 N 章
        4. 发生了什么错误
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: 程序版本
      description: 在"关于"页面可查看版本号
      placeholder: 例如：v1.0.0
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: 系统与设备
      description: 请补充系统版本、设备型号及安装方式；iOS 构建问题请附 Xcode 版本，并注明真机或模拟器。
      placeholder: |
        - 系统版本：
        - 设备型号 / CPU 架构：
        - 安装方式：Release 下载 / 源码构建 / Xcode 安装 / 其他
        - 真机或模拟器（iOS / iPadOS）：
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 日志与截图（建议）
      description: |
        如客户端提供“导出日志”，可导出后上传；iOS 构建或崩溃问题也可提供脱敏的 Xcode 输出。
        也可粘贴关键报错信息或附上截图。
      placeholder: |
        - 已附日志：是/否
        - 关键报错：
        - 截图：
    validations:
      required: false
