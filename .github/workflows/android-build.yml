name: Android Build

"on":
    workflow_call:
        inputs:
            ref:
                description: "Git ref to checkout before building. Defaults to the caller ref."
                required: false
                type: string
            version:
                description: "Version suffix used in uploaded Android artifacts."
                required: true
                type: string
            artifact-prefix:
                description: "Prefix for uploaded GitHub Actions artifact names."
                required: false
                type: string
                default: android-build
        secrets:
            ANDROID_KEYSTORE_BASE64:
                required: false
            ANDROID_KEY_ALIAS:
                required: false
            ANDROID_KEY_PASSWORD:
                required: false
            ANDROID_STORE_PASSWORD:
                required: false

permissions:
    contents: read

jobs:
    build-apk:
        name: Build Android APK
        runs-on: ubuntu-latest
        timeout-minutes: 45
        env:
            ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref || github.ref }}

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: temurin

            - name: Install Rust Android targets
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: armv7-linux-androideabi,aarch64-linux-android,x86_64-linux-android

            - name: Install cargo-ndk
              run: cargo install cargo-ndk --locked

            - name: Install native script binding toolchain
              run: sudo apt-get update && sudo apt-get install -y libclang-dev

            - name: Setup Android SDK
              uses: android-actions/setup-android@v3
              with:
                  # Override v3's obsolete default "tools" package.
                  packages: "platform-tools platforms;android-35 build-tools;36.0.0"
                  log-accepted-android-sdk-licenses: false

            - name: Install Android NDK
              shell: bash
              run: |
                  set -euo pipefail
                  set +o pipefail
                  yes | sdkmanager --licenses >/dev/null
                  set -o pipefail
                  sdkmanager "ndk;26.1.10909125"
                  echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

            - name: Cache cargo artifacts
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target/debug
                      target/release
                      target/armv7-linux-androideabi
                      target/aarch64-linux-android
                      target/x86_64-linux-android
                  key: ${{ runner.os }}-cargo-android-v2-${{ hashFiles('Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-android-v2-

            - name: Cache Gradle
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.gradle/caches
                      ~/.gradle/wrapper
                  key: ${{ runner.os }}-gradle-android-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
                  restore-keys: |
                      ${{ runner.os }}-gradle-android-
                      ${{ runner.os }}-gradle-

            - name: Decode signing keystore
              if: env.ANDROID_KEYSTORE_BASE64 != ''
              shell: bash
              run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

            - name: Build Release APK
              working-directory: android
              env:
                  ANDROID_KEYSTORE_FILE: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && 'release.keystore' || '' }}
                  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
                  ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
              run: |
                  chmod +x gradlew
                  ./gradlew :app:assembleRelease --stacktrace

            - name: Package Android artifacts
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p android-assets
                  shopt -s nullglob
                  found=0
                  for apk in android/app/build/outputs/apk/release/*.apk; do
                    base=$(basename "$apk" .apk)
                    abi=$(echo "$base" | sed -nE 's/.*-(arm64-v8a|armeabi-v7a|x86_64|x86)-release.*/\1/p')
                    if [ -z "$abi" ]; then abi="universal"; fi
                    cp "$apk" "android-assets/RustEpubReader-Android-${abi}-${{ inputs.version }}.apk"
                    found=$((found+1))
                  done
                  if [ "$found" -eq 0 ]; then
                    echo "ERROR: No APK found"
                    exit 1
                  fi
                  ls -la android-assets

            - name: Build isolated native runtime checks
              working-directory: android
              run: |
                  ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest \
                    -PREADER_DIAGNOSTIC_APPLICATION_ID=local.reader.columns --stacktrace

            - name: Install Android emulator runtime
              shell: bash
              run: |
                  set -euo pipefail
                  export ANDROID_AVD_HOME="$RUNNER_TEMP/reader-runtime-avd"
                  echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
                  sdkmanager "emulator" "system-images;android-35;google_apis;x86_64"
                  mkdir -p "$ANDROID_AVD_HOME"
                  echo no | avdmanager create avd --name ReaderRuntime \
                    --path "$ANDROID_AVD_HOME/ReaderRuntime.avd" \
                    --package "system-images;android-35;google_apis;x86_64"
                  test -f "$ANDROID_AVD_HOME/ReaderRuntime.ini"
                  "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx ReaderRuntime
                  test -e /dev/kvm
                  sudo chmod 666 /dev/kvm

            - name: Run native Android tablet smoke checks
              timeout-minutes: 8
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p target/android-runtime-logs
                  "$ANDROID_HOME/emulator/emulator" -avd ReaderRuntime -port 5554 \
                    -no-window -no-audio -no-snapshot -no-boot-anim \
                    -skin 1600x1000 -dpi-device 160 -memory 2048 -gpu swiftshader_indirect \
                    > target/android-runtime-logs/emulator.log 2>&1 &
                  READER_EMULATOR_PID=$!
                  trap 'kill "$READER_EMULATOR_PID" 2>/dev/null || true' EXIT
                  READER_BOOT_DEADLINE=$((SECONDS + 120))
                  READER_BOOTED=0
                  while (( SECONDS < READER_BOOT_DEADLINE )); do
                    if ! kill -0 "$READER_EMULATOR_PID" 2>/dev/null; then
                      cat target/android-runtime-logs/emulator.log
                      echo "::error::Android emulator exited before boot completed"
                      exit 1
                    fi
                    if [ "$(timeout 5s adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" = "1" ]; then
                      READER_BOOTED=1
                      break
                    fi
                    sleep 1
                  done
                  if [ "$READER_BOOTED" -ne 1 ]; then
                    cat target/android-runtime-logs/emulator.log
                    echo "::error::Android emulator did not boot within 120 seconds"
                    exit 1
                  fi
                  python3 scripts/check-mobile-runtime.py android \
                    --app android/app/build/outputs/apk/debug/app-x86_64-debug.apk \
                    --tests android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
                    --output target/android-runtime --with-corpus --with-talkback --with-book-opening --with-selection

            - name: Upload Android artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ inputs.artifact-prefix }}-apk
                  path: android-assets/RustEpubReader-Android-*-${{ inputs.version }}.apk
                  if-no-files-found: error

            - name: Upload native runtime reports and screenshots
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ inputs.artifact-prefix }}-runtime
                  path: |
                      target/android-runtime/*
                      target/android-runtime-logs/*
                  if-no-files-found: ignore
