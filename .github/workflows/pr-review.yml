name: PR 标签触发多平台构建

"on":
    pull_request:
        types: [labeled]

permissions:
    contents: read

jobs:
    build-desktop:
        if: github.event.label.name == 'run-build' || github.event.label.name == 'Run-Build' || github.event.label.name == 'RUN-BUILD'
        name: Build desktop packages
        uses: ./.github/workflows/desktop-build.yml
        with:
            ref: ${{ github.event.pull_request.head.sha }}
            version: sha-${{ github.event.pull_request.head.sha }}
            artifact-prefix: rustepubreader-pr-desktop

    build-android:
        if: github.event.label.name == 'run-build' || github.event.label.name == 'Run-Build' || github.event.label.name == 'RUN-BUILD'
        name: Build Android APKs
        uses: ./.github/workflows/android-build.yml
        with:
            ref: ${{ github.event.pull_request.head.sha }}
            version: sha-${{ github.event.pull_request.head.sha }}
            artifact-prefix: rustepubreader-pr-android

    build-ios:
        if: github.event.label.name == 'run-build' || github.event.label.name == 'Run-Build' || github.event.label.name == 'RUN-BUILD'
        name: Build and check iOS
        uses: ./.github/workflows/ios-build.yml
        with:
            ref: ${{ github.event.pull_request.head.sha }}
            version: sha-${{ github.event.pull_request.head.sha }}
            artifact-prefix: rustepubreader-pr-ios

    build-on-label:
        permissions:
            contents: read
            pull-requests: write
        needs:
            - build-desktop
            - build-android
            - build-ios
        if: github.event.label.name == 'run-build' || github.event.label.name == 'Run-Build' || github.event.label.name == 'RUN-BUILD'
        runs-on: ubuntu-latest
        steps:
            - name: 评论并删除标签
              uses: actions/github-script@v7
              continue-on-error: true
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      await github.rest.issues.createComment({
                        issue_number: context.issue.number,
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        body: '✅ RustEpubReader 多平台构建完成，已生成桌面端安装包、Android APK 和 iOS 构建验证产物（模拟器应用及未签名真机归档；不是可安装 IPA）。'
                      });
                      await github.rest.issues.removeLabel({
                        issue_number: context.issue.number,
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        name: context.payload.label.name
                      });
