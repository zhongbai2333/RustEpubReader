name: iOS Build

"on":
    workflow_dispatch:
    workflow_call:
        inputs:
            ref:
                description: "Git ref to checkout. Defaults to the caller ref."
                required: false
                type: string
            version:
                description: "Version label in the artifact provenance."
                required: true
                type: string
            artifact-prefix:
                required: false
                type: string
                default: ios-build

permissions:
    contents: read

env:
    DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    BUILD_VERSION: ${{ inputs.version || github.sha }}

jobs:
    native-checks:
        name: Apple core and Swift checks
        runs-on: macos-26
        timeout-minutes: 45
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref || github.sha }}
            - uses: ./.github/actions/prepare-ios
            - name: Verify shared core and native layout / OAuth
              run: |
                  python3 scripts/test-mobile-runtime.py
                  python3 scripts/test-ios-ci.py
                  python3 -m unittest discover -s ios/Tests -p test_unsigned_ipa.py
                  cargo test --locked -p reader_ios -p reader_core --features reader_core/github-sync
                  ios/scripts/check-layout.sh
                  ios/scripts/check-oauth.sh
                  ios/scripts/check-appearance.sh
                  ios/scripts/check-reading-mode.sh
                  ios/scripts/check-speech.sh
                  ios/scripts/check-contents.sh
                  ios/scripts/check-i18n.sh

    simulator-build:
        name: Build simulator application
        runs-on: macos-26
        timeout-minutes: 45
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref || github.sha }}
            - uses: ./.github/actions/prepare-ios
            - name: Resolve pinned Swift dependencies
              run: |
                  mkdir -p target/ios-ci/logs
                  xcodebuild -resolvePackageDependencies \
                    -project ios/RustEpubReader.xcodeproj -scheme ReaderPreview \
                    -clonedSourcePackagesDirPath target/ios-ci/Packages \
                    -onlyUsePackageVersionsFromResolvedFile 2>&1 | tee target/ios-ci/logs/packages.log

            - name: Build Apple Silicon simulator application
              run: |
                  xcodebuild -project ios/RustEpubReader.xcodeproj -scheme ReaderPreview \
                    -configuration Debug -sdk iphonesimulator \
                    -destination 'generic/platform=iOS Simulator' \
                    -clonedSourcePackagesDirPath target/ios-ci/Packages \
                    -disableAutomaticPackageResolution \
                    -derivedDataPath target/ios-ci/Simulator \
                    CODE_SIGN_IDENTITY=- ARCHS=arm64 READER_APP_BUNDLE_ID=local.reader.columns build 2>&1 | tee target/ios-ci/logs/simulator.log

            - name: Package simulator application
              run: |
                  mkdir -p simulator-assets
                  ditto -c -k --sequesterRsrc --keepParent \
                    target/ios-ci/Simulator/Build/Products/Debug-iphonesimulator/ReaderPreview.app \
                    simulator-assets/RustEpubReader-iOS-Simulator.zip
            - uses: actions/upload-artifact@v4
              with:
                  name: ${{ inputs.artifact-prefix || 'ios-build' }}-simulator-products
                  path: simulator-assets/*
                  overwrite: true
                  if-no-files-found: error
            - name: Preserve build logs
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ inputs.artifact-prefix || 'ios-build' }}-logs-simulator
                  path: target/ios-ci/logs/*.log
                  overwrite: true
                  if-no-files-found: ignore

    device-build:
        name: Archive and verify unsigned IPA
        runs-on: macos-26
        timeout-minutes: 45
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref || github.sha }}
            - uses: ./.github/actions/prepare-ios
            - name: Resolve pinned Swift dependencies
              run: |
                  mkdir -p target/ios-ci/logs
                  xcodebuild -resolvePackageDependencies \
                    -project ios/RustEpubReader.xcodeproj -scheme ReaderPreview \
                    -clonedSourcePackagesDirPath target/ios-ci/Packages \
                    -onlyUsePackageVersionsFromResolvedFile 2>&1 | tee target/ios-ci/logs/packages.log

            - name: Archive unsigned iPhone / iPad Release
              run: |
                  xcodebuild -project ios/RustEpubReader.xcodeproj -scheme ReaderPreview \
                    -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
                    -clonedSourcePackagesDirPath target/ios-ci/Packages \
                    -disableAutomaticPackageResolution \
                    -derivedDataPath target/ios-ci/Device \
                    -archivePath target/ios-ci/ReaderPreview.xcarchive \
                    CODE_SIGNING_ALLOWED=NO ARCHS=arm64 archive 2>&1 | tee target/ios-ci/logs/device.log

            - name: Package and verify unsigned device IPA
              run: |
                  python3 ios/scripts/package-unsigned-ipa.py pack \
                    --archive target/ios-ci/ReaderPreview.xcarchive \
                    --output-dir ios-assets --version "$BUILD_VERSION" \
                    | tee target/ios-ci/logs/ipa.log

            - name: Package supporting iOS artifacts
              run: |
                  mkdir -p ios-assets
                  ditto -c -k --sequesterRsrc --keepParent \
                    target/ios-ci/ReaderPreview.xcarchive ios-assets/RustEpubReader-iOS-UnsignedArchive.zip
                  printf 'Source: %s\nLabel: %s\n' "$(git rev-parse HEAD)" "$BUILD_VERSION" > ios-assets/BUILD-INFO.txt
                  xcodebuild -version >> ios-assets/BUILD-INFO.txt
                  rustc --version >> ios-assets/BUILD-INFO.txt
                  cp ios/UNSIGNED_IPA.md ios-assets/RustEpubReader-iOS-SIGNING.md
                  printf '\nSimulator: built separately as arm64, ad-hoc signed, Debug.\nDevice archive and IPA: arm64, Release, unsigned application. The IPA requires your own signing identity and matching provisioning profile, including re-signing embedded frameworks, before installation. See RustEpubReader-iOS-SIGNING.md. No TestFlight / App Store upload.\n' >> ios-assets/BUILD-INFO.txt

            - uses: actions/upload-artifact@v4
              with:
                  name: ${{ inputs.artifact-prefix || 'ios-build' }}-device-products
                  path: ios-assets/*
                  overwrite: true
                  if-no-files-found: error
            - name: Preserve build logs
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ inputs.artifact-prefix || 'ios-build' }}-logs-device
                  path: target/ios-ci/logs/*.log
                  overwrite: true
                  if-no-files-found: ignore

    verify-results:
        # Keep the existing final check name for callers and branch protection.
        name: Swift checks / simulator / unsigned device IPA
        needs: [native-checks, simulator-build, device-build]
        if: ${{ always() }}
        runs-on: ubuntu-latest
        steps:
            - name: Require native checks and both builds
              env:
                  JOB_RESULTS: ${{ toJSON(needs) }}
              run: |
                  python3 - <<'PY'
                  import json, os
                  results=json.loads(os.environ["JOB_RESULTS"])
                  assert set(results)=={"native-checks","simulator-build","device-build"}
                  assert all(value["result"]=="success" for value in results.values()),results
                  PY
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref || github.sha }}
            - uses: actions/download-artifact@v4
              with:
                  name: ${{ inputs.artifact-prefix || 'ios-build' }}-simulator-products
                  path: ios-assets
            - uses: actions/download-artifact@v4
              with:
                  name: ${{ inputs.artifact-prefix || 'ios-build' }}-device-products
                  path: ios-assets
            - name: Verify the transported IPA and checksum
              run: |
                  python3 -c 'import pathlib,subprocess; expected="Source: "+subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(); assert pathlib.Path("ios-assets/BUILD-INFO.txt").read_text().splitlines()[0]==expected'
                  for ipa in ios-assets/*-unsigned.ipa; do
                    test -f "$ipa"
                    python3 ios/scripts/package-unsigned-ipa.py verify "$ipa" --checksum "$ipa.sha256"
                  done
            - uses: actions/upload-artifact@v4
              with:
                  name: ${{ inputs.artifact-prefix || 'ios-build' }}-arm64
                  path: ios-assets/*
                  overwrite: true
                  if-no-files-found: error
