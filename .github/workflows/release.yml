name: Release

"on":
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            tag:
                description: "Release tag to publish, for example v1.0.5"
                required: true
                type: string

env:
    RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
    contents: write

jobs:
    verify-version:
        name: Verify release tag matches all app versions
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ env.RELEASE_TAG }}

            - name: Check release version
              run: python3 scripts/bump-version.py --check --tag "$RELEASE_TAG"

    build-desktop:
        name: Build desktop release packages
        needs: verify-version
        uses: ./.github/workflows/desktop-build.yml
        with:
            ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
            version: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
            artifact-prefix: release-desktop

    build-android:
        name: Build Android release APKs
        needs: verify-version
        uses: ./.github/workflows/android-build.yml
        with:
            ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
            version: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
            artifact-prefix: release-android
        secrets: inherit

    build-ios:
        name: Build iOS unsigned release IPA
        needs: verify-version
        uses: ./.github/workflows/ios-build.yml
        with:
            ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
            version: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
            artifact-prefix: release-ios

    publish:
        name: Publish GitHub Release
        runs-on: ubuntu-latest
        needs:
            - build-desktop
            - build-android
            - build-ios
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ env.RELEASE_TAG }}

            - name: Download release assets
              uses: actions/download-artifact@v4
              with:
                  pattern: release-*
                  path: release-assets

            - name: List release assets
              run: find release-assets -maxdepth 3 -type f -print

            - name: Verify downloaded iOS release IPA and checksum
              run: |
                  for ipa in release-assets/release-ios-arm64/*-unsigned.ipa; do
                    test -f "$ipa"
                    python3 ios/scripts/package-unsigned-ipa.py verify "$ipa" --checksum "$ipa.sha256"
                  done

            - name: Generate Release Notes
              id: generate_notes
              uses: actions/github-script@v7
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  result-encoding: string
                  script: |
                      const owner = context.repo.owner;
                      const repo = context.repo.repo;
                      const tag = process.env.RELEASE_TAG;
                      const releasesResp = await github.rest.repos.listReleases({ owner, repo, per_page: 100 });
                      const releases = releasesResp.data;
                      const tags = releases.map(r => r.tag_name);
                      const idx = tags.indexOf(tag);
                      const prev = idx < releases.length - 1 ? releases[idx + 1] : null;
                      const prevTag = prev ? prev.tag_name : null;
                      const compareUrl = prevTag ? `https://github.com/${owner}/${repo}/compare/${prevTag}...${tag}` : '';
                      const closedStart = prev ? new Date(prev.published_at).toISOString() : null;
                      const closedEnd = new Date().toISOString();

                      let query = `repo:${owner}/${repo} is:issue is:closed reason:completed`;
                      if (closedStart) query += ` closed:${closedStart}..${closedEnd}`;

                      const issues = await github.paginate(github.rest.search.issuesAndPullRequests, { q: query, per_page: 100 });
                      const negativeLabels = ['wontfix', 'duplicate', 'invalid'];
                      const groups = { Fix: [], Update: [], Feature: [] };
                      const seen = new Set();
                      for (const item of issues) {
                        if (seen.has(item.number)) continue;
                        seen.add(item.number);
                        const labels = (item.labels || []).map(l => typeof l === 'string' ? l : l.name);
                        const labelLowers = labels.map(l => String(l).toLowerCase());
                        if (labelLowers.some(l => negativeLabels.includes(l))) continue;
                        if (labelLowers.includes('question')) continue;
                        if (labelLowers.includes('bug')) groups.Fix.push(item);
                        else if (labelLowers.some(l => ['enhancement', 'feature'].includes(l))) groups.Feature.push(item);
                        else if (labelLowers.some(l => ['documentation', 'doc', 'update'].includes(l))) groups.Update.push(item);
                      }

                      let body = "# What's Changed\n\n";
                      const zh = { Fix: '修复', Update: '更新', Feature: '新增' };
                      for (const key of ['Fix', 'Update', 'Feature']) {
                        if (!groups[key].length) continue;
                        body += `## ${key}\n\n`;
                        for (const i of groups[key]) body += `- ${zh[key]}：[#${i.number}](${i.html_url}) ${i.title}\n`;
                        body += "\n";
                      }
                      if (compareUrl) body += `**Full Changelog**: ${compareUrl}\n`;
                      body += `\n### iOS installation\n\nThe iOS \`*-unsigned.ipa\` requires signing with your own identity and matching provisioning profile before installation. Embedded frameworks must also be re-signed. See the [signing instructions](https://github.com/${owner}/${repo}/blob/${encodeURIComponent(tag)}/ios/UNSIGNED_IPA.md). TestFlight and App Store distribution are not configured.\n`;
                      return body;

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ env.RELEASE_TAG }}
                  name: RustEpubReader ${{ env.RELEASE_TAG }}
                  body: ${{ steps.generate_notes.outputs.result }}
                  fail_on_unmatched_files: true
                  files: |
                      release-assets/release-desktop-*/RustEpubReader-*
                      release-assets/release-android-apk/RustEpubReader-Android-*.apk
                      release-assets/release-ios-arm64/RustEpubReader-iOS-*-unsigned.ipa
                      release-assets/release-ios-arm64/RustEpubReader-iOS-*-unsigned.ipa.sha256
                      release-assets/release-ios-arm64/RustEpubReader-iOS-SIGNING.md
                      release-assets/release-ios-arm64/BUILD-INFO.txt
